<!DOCTYPE html>
<html>
<head>
  <title>Sine Function Graph</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h2>Graph of y = sin(x)</h2>
  <canvas id="sineChart" width="800" height="400"></canvas>

  <script>
    const labels = [];
    const data = [];

    // Generate x values from -2π to 2π
    for (let x = -2 * Math.PI; x <= 2 * Math.PI; x += 0.1) {
      labels.push(x.toFixed(2));
      data.push(Math.sin(x));
    }

    const ctx = document.getElementById('sineChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'y = sin(x)',
          data: data,
          borderColor: 'blue',
          borderWidth: 2,
          fill: false,
          tension: 0.2
        }]
      },
      options: {
        scales: {
          x: {
            type: 'linear',
            title: {
              display: true,
              text: 'x (radians)'
            }
          },
          y: {
            title: {
              display: true,
              text: 'y'
            },
            min: -1.2,
            max: 1.2
          }
        }
      }
    });
  </script>
</body>
</html>
